<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal Emotion Recognition WebApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
        }
        .video-container {
            margin-bottom: 20px; /* Spazio tra il video e il pulsante */
        }
        button {
            font-size: 16px;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="bgimg w3-display-container w3-animate-opacity w3-text-white">
  <div class="w3-display-topmiddle">
    <h1 class="w3-jumbo w3-animate-top">Face Emotion&nbsp;Detection</h1>
    <hr class="w3-border-grey" style="margin:auto;width:70%">
    <br>
    <div class="video-container">
      <p style="text-align:center;">
        <img src="{{ url_for('video_feed') }}" width="95%">
      </p>
    </div>
    <div class="container">
      <button onclick="navigateToRoute('')">Exit</button>
    </div>
  </div>
</div>

<script>
    function navigateToRoute(route) {
        // Sostituisci con l'URL delle tue rotte
        const baseURL = 'http://127.0.0.1:5000/';
        window.location.href = baseURL + route;
    }
</script>

</body>
</html>
