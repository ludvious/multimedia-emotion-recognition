<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal Emotion Recognition WebApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px; /* Space between buttons */
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }
        
        button {
            font-size: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        
        button:hover {
            background-color: #0056b3;
        }

        .exit-container {
            margin-top: 50px; /* Add extra space for the exit button */
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            margin-right: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        #status {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="center-container">
        <h1>Speech Emotion Detection</h1>

        <button id="toggleRecording">Start Recording</button>
        <div id="status"></div>

        <button onclick="navigateToRoute('')">Load audio</button>

        <div class="exit-container">
            <button onclick="navigateToRoute('')">Exit</button>
        </div>
    </div>

    <script>
        const toggleButton = document.getElementById('toggleRecording');
        const statusDiv = document.getElementById('status');
        let mediaRecorder;
        let audioChunks = [];
        const duration = 1000;  // Set the duration of recording for 2 seconds (2000 ms)
        let isRecording = false;
        let recordingInterval;

        toggleButton.onclick = async () => {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        };

        async function startRecording() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                sendAudioToServer(audioBlob);
                audioChunks = [];
            };

            isRecording = true;
            toggleButton.textContent = 'Stop Recording';
            statusDiv.textContent = 'Preparing to record...';

            // Delay for consent
            setTimeout(() => {
                statusDiv.textContent = 'Recording in progress...';
                recordPeriodically();
            }, 0);  // 1 second delay
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(recordingInterval);
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            toggleButton.textContent = 'Start Recording';
            statusDiv.textContent = 'Recording stopped';
        }

        function recordPeriodically() {
            recordingInterval = setInterval(() => {
                if (mediaRecorder.state === 'inactive') {
                    mediaRecorder.start();
                    setTimeout(() => {
                        if (mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                    }, duration);  // Record for 2 seconds
                }
            }, duration);  // Start a new recording every 2 seconds
        }

        

        function sendAudioToServer(audioBlob) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'audio.wav');

            fetch('http://127.0.0.1:5000/process-audio', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const predictedLabel = data.predicted_label;
                statusDiv.innerHTML = `Emotion: ${predictedLabel}`;
            })
            .catch(error => {
                statusDiv.innerHTML = `Error: ${error}`;
            });
        }

        function navigateToRoute(route) {
            const baseURL = 'http://127.0.0.1:5000/';
            window.location.href = baseURL + route;
        }
    </script>
</body>
</html>
